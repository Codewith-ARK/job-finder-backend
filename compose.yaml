services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: jobfinder
      POSTGRES_DB: jobfinder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder -d jobfinder"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://jobfinder:jobfinder@db:5432/jobfinder
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      # Demo deployment defaults. Set COOKIE_SECURE=true behind HTTPS and disable
      # demo sign-in/seeding before any real deployment.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-true}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-true}
      DOCUMENT_DIR: /app/storage/documents
    volumes:
      - documents:/app/storage/documents
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  documents:
