services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: jobfinder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a unique URL-safe database password}
      POSTGRES_DB: jobfinder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobfinder -d jobfinder"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://jobfinder:${POSTGRES_PASSWORD:?Set a unique URL-safe database password}@db:5432/jobfinder
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set explicit HTTPS frontend origins}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      DEMO_LOGIN_ENABLED: ${DEMO_LOGIN_ENABLED:-false}
      SEED_ON_STARTUP: ${SEED_ON_STARTUP:-false}
      DOCS_TESTING_ENABLED: "false"
      DOCUMENT_DIR: /app/storage/documents
    volumes:
      - documents:/app/storage/documents
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  postgres_data:
  documents:
